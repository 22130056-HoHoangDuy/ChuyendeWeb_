server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  application:
    name: chuyende-web

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        physical_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#  flyway:
#    enabled: true
#    baseline-on-migrate: true
#    locations: classpath:db/migration
#    clean-on-validation-error: false
#    clean-disabled: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-on-validation-error: false
    clean-disabled: true
    repair-at-start: true  # Thêm dòng này vào

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: INFO
    com.ecommerce: ${LOGGING_LEVEL:DEBUG}
    org.springframework.security: INFO

payment:
  exchange-rate:
    vnd-to-usd: ${VND_TO_USD_RATE:25000}

  momo:
    partner-code: ${MOMO_PARTNER_CODE}
    access-key: ${MOMO_ACCESS_KEY}
    secret-key: ${MOMO_SECRET_KEY}
    endpoint: "https://test-payment.momo.vn/v2/gateway/api/create"
    callback-url: ${NGROK_URL}/api/v1/payments/webhook/momo
    return-url: ${NGROK_URL}/payment-success

  vnpay:
    tmn-code: ${VNPAY_TMN_CODE}
    hash-secret: ${VNPAY_HASH_SECRET} 
    url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
    ipn-url: ${NGROK_URL}/api/v1/payments/webhook/vnpay
    return-url: ${NGROK_URL}/api/v1/payments/callback/vnpay
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:ATvecIiYFU-JhsFYDSXegNHU84Gvyn53hokG-ckbasgjT9c4wfrmOl9Bdo8YS5ahJC3OsEZrqKPTZc5V}
    client-secret: ${PAYPAL_CLIENT_SECRET:EFcHyHJVqAQBSRpjj_ik9h_yhzNBa74UWgAKvtPpthIXI9FYm0Nqi9uPbyIZ14LZAVsqTy2-hj5lsj7A}
    mode: ${PAYPAL_MODE:sandbox}
    base-url: "https://api-m.sandbox.paypal.com"
    return-url: https://napping-squash-majorette.ngrok-free.dev/api/v1/payments/callback/paypal
    cancel-url: https://napping-squash-majorette.ngrok-free.dev/payment-cancel

